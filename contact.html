<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اتصل بنا - متجر سهام 🌸</title>
<link rel="stylesheet" href="style.css">
<style>
.contact-wrapper{
  min-height:100vh;
  background: linear-gradient(135deg, #fff0f6, #ffe4ec);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.contact-card{
  background:white;
  width:min(480px, 100%);
  padding:28px;
  border-radius:22px;
  border:1px solid #f0dce6;
  box-shadow: 0 10px 35px rgba(117,54,89,.12);
  text-align:center;
}
.contact-card h1{
  color:#d81b60;
  margin:0 0 5px;
  font-size:26px;
  font-weight:800;
}
.contact-card p.sub{
  color:#827583;
  font-size:13px;
  margin-bottom:18px;
}
.contact-card input, .contact-card textarea{
  width:100%;
  padding:13px 14px;
  border:1px solid #e7d5e0;
  border-radius:12px;
  font-family:inherit;
  font-size:14px;
  margin-top:12px;
  outline:none;
}
.contact-card input:focus, .contact-card textarea:focus{
  border-color:#d95f91;
  box-shadow:0 0 0 3px rgba(217,95,145,.12);
}
.btn-send{
  width:100%;
  margin-top:16px;
  background:#1b5e20;
  color:white;
  border:none;
  padding:13px;
  border-radius:12px;
  font-weight:800;
  font-family:inherit;
  font-size:16px;
  cursor:pointer;
}
.btns-row{
  display:flex;
  gap:10px;
  margin-top:14px;
}
.btns-row a{
  flex:1;
  padding:12px;
  border-radius:12px;
  text-decoration:none;
  color:white;
  font-weight:700;
  font-size:14px;
}
.back-link{
  display:block;
  margin-top:16px;
  color:#d81b60;
  font-weight:700;
  text-decoration:none;
  font-size:13px;
}
#msg{
  margin-top:12px;
  font-weight:700;
  font-size:13px;
  min-height:20px;
}
#msg.success{color:#227a51}
#msg.error{color:#b42335}
</style>
</head>
<body>

<div class="contact-wrapper">
  <div class="contact-card">
    <div style="font-size:40px;">🌸</div>
    <h1>اتصل بنا - سهام</h1>
    <p class="sub">عندك استفسار عن الطلبات التلقائية؟ رسلي لينا و ح نرد خلال 24 ساعة</p>

    <form id="contactForm" onsubmit="return sendContact(event)">
      <input id="cName" type="text" placeholder="اسمك الكامل" required>
      <input id="cPhone" type="tel" placeholder="رقم الواتساب - مثال 0912345678" required>
      <input id="cEmail" type="email" placeholder="البريد الالكتروني (اختياري)">
      <textarea id="cMessage" rows="4" placeholder="اكتبي رسالتك هنا..." required></textarea>
      
      <button type="submit" class="btn-send">📩 إرسال الرسالة</button>
    </form>

    <div id="msg"></div>

    <div class="btns-row">
      <a href="https://wa.me/249900000000" target="_blank" style="background:#25d366;">💬 واتساب</a>
      <a href="tel:0900000000" style="background:#0d6efd;">📞 اتصال</a>
    </div>

    <a href="index.html" class="back-link">← الرجوع للمتجر</a>
  </div>
</div>

<script>
async function sendContact(e){
  e.preventDefault();
  const msgBox = document.getElementById('msg');
  msgBox.textContent = 'جاري الإرسال...';
  msgBox.className = '';

  let fd = new FormData();
  fd.append('name', document.getElementById('cName').value);
  fd.append('phone', document.getElementById('cPhone').value);
  fd.append('email', document.getElementById('cEmail').value);
  fd.append('message', document.getElementById('cMessage').value);

  try{
    let res = await fetch('api.php?action=contact', {method:'POST', body: fd});
    let data = await res.json();
    if(data.status=='ok'){
      msgBox.textContent = '✅ ' + data.msg;
      msgBox.className = 'success';
      document.getElementById('contactForm').reset();
    }else{
      msgBox.textContent = '❌ حصل خطأ، حاولي تاني';
      msgBox.className = 'error';
    }
  }catch(err){
    msgBox.textContent = '❌ ما قادر يتصل بالسيرفر، تأكدي من ملف api.php';
    msgBox.className = 'error';
  }
  return false;
}
</script>

</body>
</html>
